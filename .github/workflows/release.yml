name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Match the local build environment
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build and test
        run: swift test

      - name: Build DMG
        run: |
          chmod +x scripts/build_app.sh scripts/build_dmg.sh
          scripts/build_dmg.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/TouchPilot-*.dmg
